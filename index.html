<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gramophone</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="app">

        <div id="gramophone">

            <canvas id="scene3d"></canvas>

            <img id="coverImage" alt="Album Cover" draggable="false" hidden>

             <button id="playBtn">▶</button>
<button id="resetBtn">↺</button>

<div id="progressContainer">
    <div id="progress"></div>
</div>

<div id="timeDisplay">00:00 / 00:00</div>
<div id="songInfo">
    <div id="songTitle">Unknown Song</div>
    <div id="artistName">Unknown Artist</div>
</div>
<input
    type="range"
    id="volume"
    min="0"
    max="1"
    step="0.01"
    value="1">
</div>
<input
    type="file"
    id="fileInput"
    accept="audio/*"
    hidden>
<audio id="music" src="music.mp3"></audio>
<script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.7/dist/jsmediatags.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="gramophone3d.js"></script>
<script src="script.js"></script>
</body>
</html>
